<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<meta name="robots" content="noindex">
<style>
  :root { --navy: #00274C; --bg: #fff; --text: #1d2330; --muted: #646b78; --rule: #e6e3dc; --link: #00509e; }
  @media (prefers-color-scheme: dark) {
    :root { --navy: #9cc3ff; --bg: #12161d; --text: #e6e8ec; --muted: #9aa1ad; --rule: #2a313d; --link: #8cc4ff; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  .top { max-width: 680px; margin: 0 auto; padding: 18px 16px 12px; }
  h1 { margin: 0; font-size: 1.35rem; color: var(--navy); }
  .intro { margin: 4px 0 0; color: var(--muted); }
  .map { display: block; width: 100%; height: 55vh; min-height: 320px; border: 0; background: #eee; }
  main { max-width: 680px; margin: 0 auto; padding: 0 16px 40px; }
  .open { display: block; margin: 12px 0 0; padding: 12px; border-radius: 10px; text-align: center;
          background: var(--navy); color: var(--bg); font-weight: 600; text-decoration: none; }
  .open[hidden] { display: none; }
  h2 { margin: 24px 0 2px; font-size: 1.05rem; color: var(--navy); }
  .sub { margin: 0 0 6px; color: var(--muted); font-size: .92rem; }
  ol, ul { list-style: none; margin: 0; padding: 0; }
  li { display: flex; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--rule); font-size: .95rem; }
  li:last-child { border-bottom: 0; }
  .n { flex: none; width: 20px; height: 20px; margin-top: 1px; border-radius: 50%; background: var(--navy); color: var(--bg);
       display: grid; place-items: center; font-size: .7rem; font-weight: 700; }
  .d { flex: none; width: 9px; height: 9px; margin: 7px 5px 0 6px; border-radius: 50%; }
  b { font-weight: 600; }
  .addr { color: var(--muted); }
  .dorms { font-size: .95rem; }
  a { color: var(--link); }
  .key { display: flex; flex-direction: column; gap: 4px; padding: 10px 0 2px; font-size: .85rem; color: var(--muted); }
  .k { display: flex; align-items: center; gap: 2px; }
  .k svg { flex: none; }
  .k .d { margin: 0 8px 0 3px; }
  .fd { display: inline-block; width: 9px; height: 9px; margin: 0 1px 1px 3px; border-radius: 50%; vertical-align: middle; }
</style>
</head>
<body>
<div class="top">
  <h1>Walking Ann Arbor &amp; U-M</h1>
  <p class="intro">{{INTRO}}</p>
</div>

{{MAP}}

<main>
  <div class="key">
{{KEY}}
  </div>
  <a class="open" href="{{OPEN_URL}}" target="_blank" rel="noopener"{{OPEN_HIDDEN}}>Open in Google Maps while walking ↗</a>

  <h2>Suggested stops</h2>
  <p class="sub">{{WALK_MI}} miles, about 2½–3 hours with stops. Starts and ends at Main &amp; William.</p>
  <ol>
{{STOPS}}
  </ol>

  <h2>Optional: Hill dorms</h2>
  <ul>
{{HILL}}
  </ul>

  <h2>If you have time</h2>
  <ul>
{{EXTRAS}}
  </ul>

  <h2>Food</h2>
  <ul>
{{FOOD}}
  </ul>
</main>

<script>
  const DATA = {{LEAFLET_DATA}};
  if (DATA) {
    const css = document.createElement('link');
    css.rel = 'stylesheet'; css.href = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';
    document.head.appendChild(css);
    const s = document.createElement('script');
    s.src = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';
    s.onload = () => {
      const m = L.map('leaflet', { scrollWheelZoom: false }).setView([42.278, -83.740], 15);
      L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',
        { maxZoom: 19, attribution: '© OpenStreetMap' }).addTo(m);
      const lineColor = id => '#' + (DATA.layers[id].line_color || DATA.layers[id].color);
      const g = L.geoJSON(DATA.routes, { style: f => ({ color: lineColor(f.properties.layer),
        weight: f.properties.id === 'main' ? 5 : 4, opacity: .95, lineCap: 'round',
        dashArray: f.properties.id === 'main' ? '1 9' : '1 8' }) }).addTo(m);
      DATA.places.forEach(p => {
        const c = '#' + DATA.layers[p.layer].color;
        const size = p.order ? 18 : 12;
        const badge = p.food ? `<div style="position:absolute;top:-4px;right:-5px;width:9px;height:9px;border-radius:50%;background:#${DATA.layers.food.color};border:1.5px solid #fff"></div>` : '';
        const icon = L.divIcon({ className: '', iconSize: [size, size], iconAnchor: [size / 2, size / 2],
          html: `<div style="position:relative;width:${size}px;height:${size}px;border-radius:50%;background:${c};color:#fff;border:1.5px solid #fff;display:grid;place-items:center;font:700 10px sans-serif;box-shadow:0 1px 2px #0005">${p.order || ''}${badge}</div>` });
        L.marker([p.lat, p.lng], { icon }).bindPopup(`<b>${p.order ? p.order + '. ' : ''}${p.name}</b>${p.note ? '<br>' + p.note : ''}`).addTo(m);
      });
      m.fitBounds(g.getBounds(), { padding: [8, 8] });
    };
    document.head.appendChild(s);
  }
</script>
</body>
</html>
